// -------------- view helpers --------------
function joinPackages(pk){
  // 1) If the API already returns an array of packages (maybe with nested items)
  if (Array.isArray(pk)) {
    return pk.map(p => ({
      id: Number(p.id || p.package_id),
      name: p.name,
      description: p.description,
      items: (p.items || p.package_items || []).map(it => ({
        name: it.name || it.item_name,
        quantity: Number(it.quantity),
        unit: it.unit
      }))
    }));
  }

  // 2) If the API returns {packages:[], items:[]}
  if (pk && pk.packages && pk.items) {
    const map = {};
    (pk.items || []).forEach(it => {
      (map[it.package_id] ||= []).push({
        name: it.item_name,
        quantity: Number(it.quantity),
        unit: it.unit
      });
    });
    return (pk.packages || []).map(p => ({
      id: Number(p.id),
      name: p.name,
      description: p.description,
      items: map[p.id] || []
    }));
  }

  // 3) Fallback
  return [];
}

window.onAddInventory = async function(e){
  e.preventDefault();
  const f=new FormData(e.target);
  await addInventory(f.get('item_name'), f.get('unit'), Number(f.get('quantity')));
  toast('Inventory updated','success');
  state.inventory = await fetchInventory();
  render();
};
window.onEditInventory = async function(item_name, unit, currentQty){
  const newQty = Number(prompt(`Update quantity for ${item_name} (${unit})`, currentQty));
  if(!Number.isFinite(newQty)) return;
  await jsonFetch('api.php?action=inventory', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ op:'update', item_name, unit, quantity:newQty })
  });
  toast('Inventory updated','success');
  state.inventory = await fetchInventory();
  render();
};

window.onAddPackage = async function(e){
  e.preventDefault();
  const f=new FormData(e.target);
  await jsonFetch('api.php?action=packages', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ op:'add_package', name: f.get('name'), description: f.get('description') })
  });
  toast('Package created','success');
  const pk = await fetchPackages();
  state.packages = joinPackages(pk);
  render();
};

window.onAddPackageItem = async function(e){
  e.preventDefault();
  const f=new FormData(e.target);
  await jsonFetch('api.php?action=packages', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      op:'add_item',
      package_id: Number(f.get('package_id')),
      item_name: f.get('item_name'),
      unit: f.get('unit'),
      quantity: Number(f.get('quantity'))
    })
  });
  toast('Item added to package','success');
  const pk = await fetchPackages();
  state.packages = joinPackages(pk);
  render();
};

async function onAidRequest(e){
  e.preventDefault();
  const f=new FormData(e.target);
  const mode = f.get('mode') || 'package';
  const reason = f.get('reason') || '';
  try{
    if (mode === 'package') {
  const f = new FormData(e.target);
  const keys = [...f.keys()].filter(k => k.startsWith('pkgqty_'));
  const picks = keys.map(k => {
    const id = Number(k.split('_')[1]);
    const q  = Number(f.get(k));
    return (q > 0) ? { package_id:id, quantity:q } : null;
  }).filter(Boolean);

  if (picks.length === 0) { throw new Error('Enter quantity for at least one package'); }

  for (const p of picks) {
    await createAidRequest({ mode:'package', package_id:p.package_id, quantity:p.quantity, reason });
  }

toast('Application submitted','success');
state.aidRequests = await fetchAidRequests().catch(()=>[]);
render();
}

    else if (mode === 'item') {
  const f = new FormData(e.target);

  // gather every row where quantity_# > 0
  const qtyKeys = [...f.keys()].filter(k => k.startsWith('quantity_'));
  const items = qtyKeys.map(k => {
    const idx = k.split('_')[1];
    const qty = Number(f.get(k));
    if (qty > 0) {
      return {
        item_name: f.get('item_name_' + idx),
        unit: f.get('unit_' + idx),
        quantity: qty
      };
    }
    return null;
  }).filter(Boolean);

  if (items.length === 0) { throw new Error('Enter quantity for at least one item'); }

  // submit one request per filled row (no server change needed)
  for (const it of items) {
    await createAidRequest({ mode:'item', item_name:it.item_name, unit:it.unit, quantity:it.quantity, reason });
  }

  toast('Application submitted','success');
  state.aidRequests = await fetchAidRequests().catch(()=>[]);
  render();
}


  }catch(err){ toast(err.message||'Submit failed','error'); }
}

let __leaflet, __markerLayer;
async function initVolunteerMap(){
  
  const rows = await getLocations().catch(()=>[]);

  // always recreate the map when (re)entering the page
  if (__leaflet) { try { __leaflet.remove(); } catch(e) {} __leaflet = null; }
  __leaflet = L.map('vol-map').setView([23.777,90.399],7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
              {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(__leaflet);
  setTimeout(()=>__leaflet.invalidateSize(), 100);

  if(__markerLayer){ try{ __markerLayer.remove(); }catch(e){} }
  __markerLayer = L.layerGroup().addTo(__leaflet);
  


  rows.forEach(v=>{
    const lat=parseFloat(v.lat), lng=parseFloat(v.lng);
    if(!isNaN(lat)&&!isNaN(lng)){
      L.marker([lat,lng]).addTo(__markerLayer)
        .bindPopup(`<strong>${v.name||'Volunteer'}</strong><br>${v.district||''}`);
    }
  });

  // if admin, draw table
  const u=currentUser(), role=u?.usertype||u?.type;
  if(role==='admin'){
    const div = document.getElementById('vol-table');
    if(div){
      div.innerHTML = `<div class="overflow-x-auto">
        <table class="min-w-full w-full text-sm">

          <thead><tr class="text-left">
            <th>User ID</th><th>Name</th><th>District</th><th>Lat</th><th>Lng</th>
          </tr></thead>
          <tbody>
          ${rows.map(r=>`
            <tr class="border-t">
              <td>${r.user_id}</td>
              <td>${r.name||''}</td>
              <td>${r.district||''}</td>
              <td>${r.lat??''}</td>
              <td>${r.lng??''}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
    }
  }
}

const key='approvedNotified'; const notified=new Set(JSON.parse(localStorage.getItem(key)||'[]'));
function checkApprovals(){
  if(!state.aidRequests||!state.aidRequests.length) return;
  state.aidRequests.forEach(r=>{
    if(r.request_status==='approved' && !notified.has(r.request_id)){
      toast(`Your request #${r.request_id} has been approved 🎉`,'success');
      notified.add(r.request_id);
    }
  });
  localStorage.setItem(key,JSON.stringify(Array.from(notified)));
}
